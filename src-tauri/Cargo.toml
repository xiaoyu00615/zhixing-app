[package]
name = "zhixing"
version = "0.0.0"
description = "Tauri native skeleton for zhixing"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zhixing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
