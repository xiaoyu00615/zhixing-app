[package]
name = "zhixing"
version = "0.0.0"
description = "Tauri native skeleton for zhixing"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zhixing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = "0.3"

# P6-S8: the Windows live-database switch uses the OS atomic replace capability
# (`ReplaceFileW`), which is the only way to express "replace the live database
# AND keep the previous one as a rollback candidate" as ONE atomic step. Narrow,
# target-specific, and deliberately not pulled in on other platforms (the shared
# restore domain never mentions Windows concepts).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # P7-S2: Gate A exercises the CNG key-storage providers (`NCrypt*`), and Gate B
    # reads TPM capability through TBS (`Tbsi_GetDeviceInfo`). Both are reached through
    # the SAME already-approved `windows-sys` crate — no new dependency is introduced.
    "Win32_Security_Cryptography",
    "Win32_System_TpmBaseServices",
] }

[dev-dependencies]
tempfile = "3"
